name: Crews By Core *
description: 'Crews by Core was a construction field-execution platform based in Palo
  Alto, California (with a Tokyo office), founded and led by CEO Di-Ann Eisnor. Branded
  "Mission Control for the Field," its mobile-first product gave superintendents and
  foremen a single tool for lookahead scheduling, jobsite logistics, drawings, and
  field-to-office messaging, layered with AI-driven risk detection to quantify and
  mitigate schedule and financial risk on the jobsite. The company was backed by GV
  (Google Ventures) among ten investors and was acquired by construction IoT company
  WakeCap on July 1, 2024, folding its scheduling and communication tooling into WakeCap''s
  worker-productivity sensor platform. Crews by Core did not expose a public developer
  API; this profile documents the company for the API Evangelist network.'
